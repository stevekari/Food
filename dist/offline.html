<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | STEVE FOOD</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0c0a09;
      color: #f5f5f4;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #1c1917;
      border: 1px solid #292524;
      border-radius: 28px;
      padding: 40px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    }
    .icon-wrapper {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #f59e0b, #ea580c, #dc2626);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 38px;
      box-shadow: 0 10px 25px -5px rgba(234, 88, 12, 0.4);
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    h1 span {
      color: #f59e0b;
    }
    p {
      font-size: 14px;
      color: #a8a29e;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      color: #0c0a09;
      font-weight: 700;
      font-size: 14px;
      padding: 14px 28px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      width: 100%;
      text-decoration: none;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn:hover {
      opacity: 0.95;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #fbbf24;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.25);
      padding: 6px 14px;
      border-radius: 9999px;
      margin-bottom: 18px;
    }
    .dot {
      width: 8px;
      height: 8px;
      background-color: #f59e0b;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrapper">👨‍🍳</div>
    <div class="status-badge">
      <span class="dot"></span>
      <span>No Internet Connection</span>
    </div>
    <h1>STEVE <span>FOOD</span></h1>
    <p>You appear to be offline right now. Check your internet connection or Wi-Fi to place fresh orders and sync your food credits.</p>
    <button class="btn" onclick="window.location.reload()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
      </svg>
      Try Reconnecting
    </button>
  </div>
</body>
</html>
