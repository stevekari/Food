<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="hatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4" />

  <!-- Chef Hat & Burger Icon -->
  <g filter="url(#shadow)" transform="translate(106, 96)">
    <!-- Chef Hat Base Band -->
    <rect x="60" y="220" width="180" height="34" rx="10" fill="url(#hatGrad)" />
    <rect x="70" y="240" width="160" height="6" rx="3" fill="#ea580c" opacity="0.3" />

    <!-- Chef Hat Puffs -->
    <!-- Center puff -->
    <circle cx="150" cy="120" r="76" fill="url(#hatGrad)" />
    <!-- Left puff -->
    <circle cx="95" cy="150" r="58" fill="url(#hatGrad)" />
    <!-- Right puff -->
    <circle cx="205" cy="150" r="58" fill="url(#hatGrad)" />

    <!-- Hat Folds / Detail Shadows -->
    <path d="M120 180 Q135 150 150 180" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M150 180 Q165 150 180 180" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Fork & Knife crossed badge underneath -->
    <circle cx="150" cy="275" r="24" fill="#0c0a09" />
    <text x="150" y="284" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#f59e0b" text-anchor="middle">★</text>
  </g>

  <!-- STEVE FOOD text badge -->
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Space Grotesk', 'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="900" letter-spacing="4" fill="#ffffff" text-anchor="middle" filter="url(#shadow)">
    STEVE<tspan fill="#fef08a"> FOOD</tspan>
  </text>
</svg>